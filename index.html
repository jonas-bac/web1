<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Landing page" />
    <title>Landing</title>

    <style>
      /* ---- Base / best-practice defaults ---- */
      :root {
        /* Customize these */
        --left-bg: #0b1220;   /* dark navy */
        --right-bg: #f6f7fb;  /* soft light */
        --left-fg: #ffffff;
        --right-fg: #0b1220;

        --max-width: 1100px;
        --pad: clamp(16px, 4vw, 48px);
        --radius: 16px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: var(--font);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      img, svg, video { max-width: 100%; display: block; }
      a { color: inherit; }

      /* ---- Layout ---- */
      .split {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .panel {
        padding: var(--pad);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .panel__inner {
        width: min(var(--max-width), 100%);
      }

      .left {
        background: var(--left-bg);
        color: var(--left-fg);
      }

      .right {
        background: var(--right-bg);
        color: var(--right-fg);
      }

      /* Optional “card” content area placeholder */
      .card {
        border-radius: var(--radius);
        padding: clamp(18px, 3vw, 28px);
        box-shadow: var(--shadow);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.10);
        backdrop-filter: blur(6px);
      }

      .right .card {
        background: #ffffff;
        border: 1px solid rgba(11, 18, 32, 0.08);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(22px, 3vw, 34px);
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        opacity: 0.9;
        max-width: 55ch;
      }

      /* ---- Responsive: stack on small screens ---- */
      @media (max-width: 800px) {
        .split {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 1fr;
        }
      }

      /* ---- Accessibility: reduce motion (if you add animations later) ---- */
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>

  <body>
    <main class="split" aria-label="Split landing page">
      <section class="panel left" aria-label="Left panel">
        <div class="panel__inner">
          <div class="card">
            <h1>Left Side</h1>
            <p>
              Replace this with your content. This is a minimal, clean starter with
              good defaults (responsive layout, sensible typography, and accessible structure).
            </p>
          </div>
        </div>
      </section>

      <section class="panel right" aria-label="Right panel">
        <div class="panel__inner">
          <div class="card">
            <h1>Right Side</h1>
            <p>
              Put your embed, call-to-action, or anything else here. Colors are controlled
              via CSS variables in <code>:root</code>.
            </p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
